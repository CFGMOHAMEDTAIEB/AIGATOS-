services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aigatos
      POSTGRES_USER: aigatos
      POSTGRES_PASSWORD: aigatos_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - type: bind
        source: D:/AIGATOS/docker-data/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigatos -d aigatos"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - type: bind
        source: D:/AIGATOS/docker-data/redis
        target: /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
