<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>$title</title><style>
:root{--navy:#17324d;--teal:#157a78;--light:#eef4f6;--muted:#526373}*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#1d2935;background:#f4f7f8;line-height:1.48}
main{width:min(980px,calc(100% - 40px));margin:24px auto;background:white;box-shadow:0 8px 30px #17324d22}
header{padding:64px 58px;color:white;background:linear-gradient(135deg,var(--navy),var(--teal))}header h1{margin:0 0 8px;font-size:44px;letter-spacing:2px}header h2{margin:0 0 28px;font-size:24px;font-weight:400}
.cover-grid,.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.cover-grid div{padding:10px 0;border-top:1px solid #ffffff55}
section{padding:28px 58px;border-bottom:1px solid #dce5e8}h3{color:var(--navy);font-size:22px;margin:0 0 16px}h4{color:var(--teal);margin:18px 0 8px}
.notice{padding:14px 16px;background:#fff4dc;border-left:4px solid #e09b24}.metric{padding:14px;background:var(--light);border-radius:6px}.metric strong{display:block;font-size:24px;color:var(--navy)}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}th{background:var(--navy);color:white;text-align:left}th,td{padding:9px 10px;border:1px solid #ccd9de;vertical-align:top;overflow-wrap:anywhere}tr:nth-child(even) td{background:#f7fafb}
code{font-family:Consolas,monospace;font-size:12px;overflow-wrap:anywhere}.blank{min-height:38px;border-bottom:1px solid #667;margin:8px 0 18px}footer{padding:20px 58px;color:var(--muted);font-size:12px}@media print{body{background:white}main{width:100%;margin:0;box-shadow:none}section{break-inside:avoid}}
</style></head><body><main>$body</main></body></html>
