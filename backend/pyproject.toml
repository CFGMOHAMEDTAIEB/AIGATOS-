[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aigatos-backend"
version = "0.2.0"
description = "AIGATOS OTA campaign API and simulator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.5,<6",
  "openai>=2,<3",
  "python-dotenv>=1,<2",
  "reportlab>=5,<6",
  "pypdf>=6,<7",
  "pdfplumber>=0.11,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
ml = ["scikit-learn>=1.9,<2", "pandas>=3,<4", "matplotlib>=3.11,<4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local PostgreSQL and Redis services"]
